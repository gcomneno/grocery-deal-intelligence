[project]
name = "grocery-deal-intelligence"
version = "0.1.0"
description = "Verifiable learning laboratory for cross-retailer grocery deal intelligence"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.10,<5",
]

[project.optional-dependencies]
ai = [
    "giadaware-ai @ git+https://github.com/gcomneno/giadaware-ai.git@21615d47e6ab7da4a0d36595d51b3051a489079a",
]
dev = [
    "pytest>=8,<9",
    "giadaware-ai @ git+https://github.com/gcomneno/giadaware-ai.git@21615d47e6ab7da4a0d36595d51b3051a489079a",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
